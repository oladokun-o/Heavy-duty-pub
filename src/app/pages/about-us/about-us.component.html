<div class="page-head">
  <div
    class="page-head__bg"
    style="background-image: url(assets/img/bg_page-about.jpg)"
  >
    <div class="page-head__title">About Company</div>
    <div class="page-head__breadcrumb">
      <ul class="uk-breadcrumb">
        <li><a routerLink="/">Home</a></li>
        <li><span>About Company</span></li>
      </ul>
    </div>
  </div>
</div>

<section class="s-features">
  <div class="uk-section uk-container">
    <div class="uk-grid uk-child-width-1-2@m uk-flex-middle" data-uk-grid>
      <div>
        <div class="section-title">
          <small class="color-accent"></small>
          <h3>Providing Tailored Solutions to Empower Industries</h3>
        </div>
      </div>
      <div>
        <div class="section-content">
          <article
            class="fs-6"
            style="line-height: 25px"
            [innerHTML]="aboutUsData?.description"
          ></article>
        </div>
      </div>
    </div>
    <div class="feature-items">
      <div data-uk-slider>
        <div class="uk-position-relative" tabindex="-1">
          <ul
            class="uk-grid uk-slider-items uk-child-width-1-1 uk-child-width-1-2@s uk-child-width-1-3@l"
          >
            <li class="d-flex">
              <div class="feature-item h-100">
                <div class="feature-item__box h-100">
                  <div class="feature-item__icon">
                    <img src="assets/img/ico-feature-1.png" alt="image" />
                  </div>
                  <div class="feature-item__title">Our Mission</div>
                  <div
                    class="feature-item__text"
                    [innerHTML]="aboutUsData?.mission"
                  ></div>
                  <div class="feature-item__more">
                    <a><span data-uk-icon="arrow-right"></span></a>
                  </div>
                </div>
              </div>
            </li>
            <li>
              <div class="feature-item">
                <div class="feature-item__box">
                  <div class="feature-item__icon">
                    <img src="assets/img/ico-feature-2.png" alt="image" />
                  </div>
                  <div class="feature-item__title">Our Vision</div>
                  <div
                    class="feature-item__text"
                    [innerHTML]="aboutUsData?.vision"
                  ></div>
                  <div class="feature-item__more">
                    <a><span data-uk-icon="arrow-right"></span></a>
                  </div>
                </div>
              </div>
            </li>
          </ul>
        </div>
        <ul class="uk-slider-nav uk-dotnav uk-flex-center uk-margin"></ul>
      </div>
    </div>
  </div>
</section>

<section class="s-team">
  <div class="uk-section uk-container">
    <div class="section-title --center">
      <span></span>
      <h3>Meet Our Team Members</h3>
    </div>
    <div class="section-content d-flex flex-row flex-wrap">
      <div class="team-user" *ngFor="let founder of aboutUsData?.founders">
        <div class="team-user__photo">
          <img [src]="founder.image.asset.url" alt="team" />
        </div>
        <div class="team-user__body">
          <div class="team-user__name" [innerHTML]="founder.name"></div>
          <div class="team-user__position" [innerHTML]="founder.role"></div>
          <div class="team-user__social">
            <ul class="social">
              <li
                *ngFor="let social of founder?.socialMedia | keyvalue"
                class="social__item"
              >
                <a class="social__link" [href]="social.value" target="_blank">
                  <span [attr.data-uk-icon]="getIcon(social.key)"></span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
